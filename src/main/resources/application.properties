spring.application.name=Backend

# Carga opcional del archivo .env en desarrollo local.
# En Render (y en CI) las variables se inyectan directamente como variables de entorno,
# por lo que el archivo no existe y la importacion se omite sin fallar.
spring.config.import=optional:file:.env[.properties]

# ---- Base de datos (PostgreSQL) ----
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Usuario administrador inicial (DataSeeder) ----
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ---- Servidor ----
# Render asigna el puerto por medio de la variable PORT.
server.port=${PORT:8080}
